name: Complete PRISM UI session integration

on:
  push:
    paths:
      - '.github/workflows/complete-ui-integration.yml'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Migrate browser auth from API keys to session cookies
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('static/app.js')
          s = p.read_text(encoding='utf-8')

          s = re.sub(
              r'function getApiKey\(\) \{.*?\n\}\n\nfunction setApiKey\(key\) \{.*?\n\}\n',
              'function getApiKey() { return ""; }\n\nfunction setApiKey(_key) { /* browser API keys are intentionally disabled */ }\n',
              s, count=1, flags=re.S)

          s = s.replace(
              'const opts = { method, headers: { "X-Request-ID": crypto.randomUUID?.() || String(Date.now()) } };',
              'const opts = { method, credentials: "same-origin", headers: { "X-Request-ID": crypto.randomUUID?.() || String(Date.now()) } };',
              1,
          )

          s = re.sub(
              r'\n  const key = getApiKey\(\);\n  if \(key\) opts\.headers\["X-API-Key"\] = key;\n',
              '\n', s, count=1)
          s = s.replace(
              'if (res.status === 401) msg = "Unauthorized — set a valid API key in Settings";',
              'if (res.status === 401) { location.replace("/login"); msg = "Your session expired. Please sign in again."; }',
              1,
          )

          session_fn = r'''
/* ---------- Human session / workspace identity ---------- */
async function initSession() {
  const actions = $("#topbar-actions");
  if (!actions) return;
  try {
    const res = await fetch(BASE_API_URL + "/auth/me", { credentials: "same-origin", cache: "no-store" });
    if (!res.ok) { location.replace("/login"); return; }
    const data = await res.json();
    const user = data.user || {};
    const tenant = data.tenant || {};
    const old = $("#prism-session");
    if (old) old.remove();
    const wrap = document.createElement("div");
    wrap.id = "prism-session";
    wrap.style.cssText = "display:flex;align-items:center;gap:8px;margin-right:8px";
    wrap.innerHTML = `<span style="font-size:12px;color:var(--muted,#8d99aa);text-align:right"><b style="color:var(--text,#eef2f7)">${esc(user.email || "User")}</b><br><span>${esc(tenant.name || "Workspace")} · ${esc(user.role || "viewer")}</span></span><button class="icon-btn" id="prism-logout" title="Sign out" aria-label="Sign out">↪</button>`;
    actions.prepend(wrap);
    $("#prism-logout", wrap).onclick = async () => {
      try { await fetch(BASE_API_URL + "/auth/logout", { method: "POST", credentials: "same-origin" }); } finally { location.replace("/login"); }
    };
    const settings = $("#btn-settings");
    if (settings) { settings.title = "Workspace session"; settings.style.display = "none"; }
    window.PRISM_SESSION = data;
  } catch (_e) {
    location.replace("/login");
  }
}
'''
          marker = '/* ---------- Settings / API Key ---------- */'
          if 'async function initSession()' not in s:
              s = s.replace(marker, session_fn + '\n' + marker, 1)
          s = s.replace('function init() {\n  wireGlobal();', 'function init() {\n  void initSession();\n  wireGlobal();', 1)
          p.write_text(s, encoding='utf-8')

      - name: Add workspace UX styles without changing the existing design system
        shell: bash
        run: |
          cat >> static/styles.css <<'EOF'

/* PRISM 2.0 session identity */
#prism-session { min-width: 0; }
#prism-session span { line-height: 1.15; }
@media (max-width: 760px) {
  #prism-session span { display: none; }
}
EOF

      - name: Commit integration changes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'prism-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/complete-ui-integration.yml
          git add static/app.js static/styles.css
          git commit -m 'feat: complete session-based investigation console auth'
          git push
